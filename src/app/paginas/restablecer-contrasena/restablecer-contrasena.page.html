<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Restablecer Contraseña</ion-title>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/login']">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <ion-list>
      <ion-item>
        <ion-input
          [(ngModel)]="email"
          labelPlacement="floating"
          placeholder="Tu correo"
          type="email"
        >
          <div slot="label">Ingresa tu Email <ion-text color="danger">*</ion-text></div>
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="resetPassword()">Enviar solicitud</ion-button>
  </div>
</ion-content>
